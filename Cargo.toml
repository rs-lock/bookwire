[workspace]
members = [ "crates/core", "crates/venue","crates/hyperliquid","crates/lighter","crates/aggregator","crates/api","crates/supervisor", "crates/binance"]
resolver = "3"

[workspace.package]
edition = "2024"
version = "0.1.0"
license = "MIT"
rust-version = "1.85"

[workspace.dependencies]
# inner
clob-core = { path = "crates/core" }
clob-venue = { path = "crates/venue" }
clob-hyperliquid = { path = "crates/hyperliquid" }
clob-lighter = { path = "crates/lighter" }
clob-aggregator = { path = "crates/aggregator" }
clob-binance = { path = "crates/binance" }

# runtime / transport
tokio = { version = "1", features = [
    "rt-multi-thread",
    "macros",
    "sync",
    "time",
    "signal",
    "fs",
] }
tokio-util = "0.7"
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"] }
reqwest = { version = "0.12", default-features = false, features = [
    "json",
    "rustls-tls-webpki-roots",
] }
rustls = "0.23"
futures-util = "0.3"
async-trait = "0.1.89"
clap = { version = "4.6.6", features = ["derive"] }
sha2 = "0.11"

# ser
uuid = { version = "1", features = ["v4"] }
arrayvec = { version = "0.7.8", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

# logs
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
metrics = "0.24"
metrics-exporter-prometheus = "0.16"

# api
axum = { version = "0.8", features = ["ws"] }

# bench
proptest = "1"
criterion = { version = "0.5", features = ["html_reports"] }

[profile.release]
debug = true
lto = "thin"
codegen-units = 1

[profile.bench]
debug = true
